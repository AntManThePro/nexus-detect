<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0f">
<title>NEXUS // DETECT</title>
<style>
:root{--g:#00ff87;--c:#60efff;--p:#ff0080;--y:#ffcc00;--bg:#0a0a0f;--line:#1c1c28}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:#fff;font-family:Inter,system-ui,sans-serif;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;border-bottom:1px solid var(--line);background:#0c0c14}
.brand{display:flex;align-items:center;gap:8px}
.sigil{width:26px;height:26px}
.word{font-weight:800;letter-spacing:.12em;font-size:13px;color:var(--g)}
.sub{font-size:9px;color:#8a8aa0}
.chip{font-size:9px;color:var(--c);border:1px solid #1e3a44;border-radius:99px;padding:3px 8px}
.layout{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{height:34dvh;min-height:150px;position:relative;background:#07070c}
canvas{width:100%;height:100%;display:block;touch-action:none}
.hud{position:absolute;left:8px;top:8px;font-size:10px;pointer-events:none}
.pill{border:1px solid #333;border-radius:99px;padding:3px 8px;background:rgba(0,0,0,.65);width:max-content;max-width:92vw}
.pane{flex:1;min-height:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.bar{display:flex;gap:6px;padding:8px;align-items:center;flex-wrap:wrap}
button{border:1px solid #2a2a38;background:#16161f;color:#ddd;border-radius:8px;padding:7px 10px;font-size:11px;font-weight:650}
button.on{border-color:var(--g);color:var(--g)}
.stats{margin-left:auto;font:11px ui-monospace,monospace;color:var(--y)}
.cols{flex:1;min-height:0;display:grid;grid-template-rows:auto 1fr}
.rules{display:flex;gap:6px;padding:0 8px 8px;overflow:auto}
.rule{border:1px solid #222;border-radius:8px;padding:6px 8px;font-size:10px;min-width:120px;background:#101018}
.rule b{display:block;color:var(--g);font-size:14px}
.list{overflow:auto}
.item{display:grid;grid-template-columns:64px 1fr;gap:8px;padding:8px 10px;border-bottom:1px solid #181824}
.tag{font-size:9px;font-weight:800;color:var(--p)}
.title{font-size:12px;line-height:1.3}
.meta{font-size:9px;color:#777;margin-top:3px}
@media(min-width:900px){
  .layout{flex-direction:row}
  .stage{height:auto;flex:1}
  .pane{width:420px;border-top:0;border-left:1px solid var(--line)}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <svg class="sigil" viewBox="0 0 64 64"><rect width="64" height="64" rx="12" fill="#0a0a0f"/><path d="M14 48 V16 H26 L38 36 V16 H50 V48 H38 L26 28 V48 Z" fill="none" stroke="#00ff87" stroke-width="3"/><circle cx="32" cy="32" r="5" fill="#ff0080"/></svg>
    <div><div class="word">NEXUS</div><div class="sub">NExtended Xperimental USers</div></div>
  </div>
  <div class="chip">DoubleA · AntManThePro</div>
</header>
<div class="layout">
  <div class="stage" id="stage">
    <canvas id="c"></canvas>
    <div class="hud"><div class="pill" id="src">detector on public KEV snapshot 2026.10.02</div></div>
  </div>
  <aside class="pane">
    <div class="bar">
      <button id="run" class="on">RUN DETECT</button>
      <button id="live">TRY LIVE</button>
      <button id="fit">FIT</button>
      <div class="stats" id="stats">0 hits</div>
    </div>
    <div class="cols">
      <div class="rules" id="rules"></div>
      <div class="list" id="list"></div>
    </div>
  </aside>
</div>
<script>
const SNAPSHOT = [
  {cve:"CVE-2026-102490", vendor:"Zammad", product:"Zammad", name:"Improper privilege management", date:"2026-10-02", ransomware:false},
  {cve:"CVE-2026-102489", vendor:"Zammad", product:"Zammad", name:"Session fixation", date:"2026-10-02", ransomware:false},
  {cve:"CVE-2026-104286", vendor:"Fortinet", product:"FortiMail", name:"Path traversal", date:"2026-10-01", ransomware:false},
  {cve:"CVE-2026-76504", vendor:"Cisco", product:"Catalyst SD-WAN Manager", name:"Hex encoding flaw", date:"2026-09-30", ransomware:false},
  {cve:"CVE-2026-86950", vendor:"Apple", product:"iOS / macOS", name:"CoreGraphics out-of-bounds write", date:"2026-09-29", ransomware:false},
  {cve:"CVE-2026-88772", vendor:"Citrix", product:"NetScaler", name:"Memory-bounds restriction", date:"2026-09-27", ransomware:false},
  {cve:"CVE-2026-88771", vendor:"Citrix", product:"NetScaler", name:"Improper input validation", date:"2026-09-27", ransomware:false},
  {cve:"CVE-2026-67279", vendor:"MikroTik", product:"RouterOS", name:"Workflow enforcement flaw", date:"2026-09-25", ransomware:false},
  {cve:"CVE-2026-65660", vendor:"Microsoft", product:"SharePoint", name:"Code injection", date:"2026-09-25", ransomware:false},
  {cve:"CVE-2026-87902", vendor:"WordPress", product:"Core", name:"Remote file inclusion", date:"2026-09-25", ransomware:false},
  {cve:"CVE-2026-5430", vendor:"WSO2", product:"API Manager", name:"Path traversal", date:"2026-09-24", ransomware:false},
  {cve:"CVE-2026-71362", vendor:"Adobe", product:"Commerce", name:"Incorrect authorization", date:"2026-09-24", ransomware:false},
  {cve:"CVE-2026-93952", vendor:"Arista", product:"VeloCloud", name:"Improper input validation", date:"2026-09-22", ransomware:false},
  {cve:"CVE-2026-94127", vendor:"F5", product:"BIG-IP APM", name:"Heap buffer overflow", date:"2026-09-22", ransomware:false}
];
const AS_OF = "2026-10-04";
let rows = SNAPSHOT.slice();
let hits = [];
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const stage = document.getElementById('stage');
let particles = [], cam = {x:0,y:0,z:1}, pointers = new Map(), drag = null, pinch0 = 0;
const cie = {x:0,y:0,r:26}, edge = {x:150,y:-70,r:20};

function ageDays(date){
  return Math.round((Date.parse(AS_OF) - Date.parse(date)) / 86400000);
}
function detect(list){
  const rules = {fresh:0, cluster:0, edge:0, pair:0};
  hits = [];
  const byVendor = {};
  list.forEach(v => { byVendor[v.vendor] = (byVendor[v.vendor]||0)+1; });
  list.forEach(v => {
    const age = ageDays(v.date);
    const reasons = [];
    if(age <= 3){ reasons.push("added in last 3 days"); rules.fresh++; }
    if((byVendor[v.vendor]||0) >= 2){ reasons.push("vendor cluster"); rules.cluster++; }
    if(/NetScaler|FortiMail|RouterOS|SD-WAN|BIG-IP|VeloCloud/i.test(v.product)){ reasons.push("edge appliance class"); rules.edge++; }
    if(v.ransomware){ reasons.push("known ransomware use"); rules.pair++; }
    if(reasons.length){
      hits.push({...v, age, reasons, score: reasons.length * 20 + Math.max(0, 12-age)});
    }
  });
  hits.sort((a,b)=> b.score - a.score);
  document.getElementById('rules').innerHTML = [
    ["FRESH", rules.fresh], ["CLUSTER", rules.cluster], ["EDGE", rules.edge], ["HITS", hits.length]
  ].map(([k,n])=>`<div class="rule"><b>${n}</b>${k}</div>`).join("");
  document.getElementById('list').innerHTML = hits.map(h=>`
    <div class="item">
      <div class="tag">+${h.score}<div class="meta">${h.age}d</div></div>
      <div><div class="title">${h.cve} · ${h.vendor} ${h.product}</div><div class="meta">${h.name} — ${h.reasons.join(" · ")}</div></div>
    </div>`).join("") || `<div class="item"><div class="tag">CLEAR</div><div class="title">No rule hits</div></div>`;
  document.getElementById('stats').textContent = hits.length + " hits";
  hits.slice(0,4).forEach((_,i)=> setTimeout(pulse, i*180));
}
function pulse(){ particles.push({x:edge.x,y:edge.y,tx:cie.x,ty:cie.y,c:"#ff0080",life:1}); }
function resize(){
  const r = stage.getBoundingClientRect(), dpr = Math.min(devicePixelRatio||1,2);
  canvas.width = Math.max(1, r.width*dpr|0); canvas.height = Math.max(1, r.height*dpr|0);
  canvas.style.width = r.width+"px"; canvas.style.height = r.height+"px";
  ctx.setTransform(dpr,0,0,dpr,0,0);
}
function fit(){ cam = {x:-40,y:10,z:Math.max(.6, Math.min(1.3, Math.min(stage.clientWidth, stage.clientHeight)/380))}; }
function s2w(x,y){ const w=stage.clientWidth,h=stage.clientHeight; return {x:(x-w/2)/cam.z-cam.x, y:(y-h/2)/cam.z-cam.y}; }
function draw(){
  const w=stage.clientWidth,h=stage.clientHeight;
  ctx.clearRect(0,0,w,h); ctx.fillStyle="#07070c"; ctx.fillRect(0,0,w,h);
  ctx.save(); ctx.translate(w/2,h/2); ctx.scale(cam.z,cam.z); ctx.translate(cam.x,cam.y);
  ctx.strokeStyle="#ff0080"; ctx.globalAlpha=.7; ctx.lineWidth=2/cam.z; ctx.shadowColor="#ff0080"; ctx.shadowBlur=8;
  ctx.beginPath(); ctx.moveTo(cie.x,cie.y); ctx.lineTo(edge.x,edge.y); ctx.stroke(); ctx.shadowBlur=0; ctx.globalAlpha=1;
  particles.forEach(p=>{ctx.fillStyle=p.c;ctx.shadowColor=p.c;ctx.shadowBlur=12;ctx.beginPath();ctx.arc(p.x,p.y,4,0,6.28);ctx.fill();ctx.shadowBlur=0});
  [[cie,"CIE","#ff0080"],[edge,"DETECT","#00ff87"]].forEach(([n,label,color])=>{
    ctx.shadowColor=color; ctx.shadowBlur=14; ctx.fillStyle="#0c0c14"; ctx.strokeStyle=color; ctx.lineWidth=2.4/cam.z;
    ctx.beginPath(); ctx.arc(n.x,n.y,n.r,0,6.28); ctx.fill(); ctx.stroke(); ctx.shadowBlur=0;
    ctx.fillStyle="#fff"; ctx.font="11px Inter"; ctx.textAlign="center"; ctx.fillText(label, n.x, n.y+n.r+14);
  });
  ctx.restore();
}
function step(){
  particles.forEach(p=>{p.x+=(p.tx-p.x)*.08;p.y+=(p.ty-p.y)*.08;p.life-=.02});
  particles=particles.filter(p=>p.life>0 && Math.hypot(p.tx-p.x,p.ty-p.y)>4);
  draw(); requestAnimationFrame(step);
}
async function tryLive(){
  document.getElementById('src').textContent = "contacting CISA KEV…";
  try{
    const ctrl = new AbortController();
    const to = setTimeout(()=>ctrl.abort(), 7000);
    const res = await fetch("https://www.cisa.gov/sites/default/files/feeds/known_exploited_vulnerabilities.json", {signal:ctrl.signal});
    clearTimeout(to);
    if(!res.ok) throw new Error("http");
    const data = await res.json();
    const vulns = (data.vulnerabilities||[]).slice(0, 20);
    if(!vulns.length) throw new Error("empty");
    rows = vulns.map(v => ({
      cve:v.cveID, vendor:v.vendorProject, product:v.product, name:v.vulnerabilityName,
      date:v.dateAdded, ransomware: v.knownRansomwareCampaignUse === "Known"
    }));
    document.getElementById('src').textContent = "LIVE CISA KEV " + (data.catalogVersion||"") + " · detector running";
    detect(rows);
  }catch(e){
    document.getElementById('src').textContent = "live blocked · detector on KEV snapshot 2026.10.02";
    rows = SNAPSHOT; detect(rows);
  }
}
function ptr(e){const r=canvas.getBoundingClientRect(), t=e.touches?e.touches[0]:e; return {x:t.clientX-r.left,y:t.clientY-r.top}}
canvas.addEventListener("pointerdown", e=>{
  canvas.setPointerCapture(e.pointerId); const p=ptr(e); pointers.set(e.pointerId,p);
  if(pointers.size===1) drag={kind:"pan",x:p.x,y:p.y,cx:cam.x,cy:cam.y};
  else { const a=[...pointers.values()]; pinch0=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); drag={kind:"pinch",z:cam.z}; }
});
canvas.addEventListener("pointermove", e=>{
  if(!pointers.has(e.pointerId)) return; const p=ptr(e); pointers.set(e.pointerId,p);
  if(pointers.size===2){ const a=[...pointers.values()]; const d=Math.hypot(a[0].x-a[1].x,a[0].y-a[1].y); if(pinch0) cam.z=Math.max(.4,Math.min(2.2,drag.z*(d/pinch0))); return; }
  if(drag && drag.kind==="pan"){ cam.x=drag.cx+(p.x-drag.x)/cam.z; cam.y=drag.cy+(p.y-drag.y)/cam.z; }
});
function up(e){ pointers.delete(e.pointerId); if(!pointers.size) drag=null; }
canvas.addEventListener("pointerup", up); canvas.addEventListener("pointercancel", up);
document.getElementById("run").onclick = () => detect(rows);
document.getElementById("live").onclick = tryLive;
document.getElementById("fit").onclick = fit;
window.addEventListener("resize", resize);
resize(); fit(); detect(rows); requestAnimationFrame(step);
</script>
</body>
</html>
